<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — Swayam Nakte</title>
  <meta name="description" content="Swayam Nakte's blog — thoughts on competitive programming, development, and more.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --surface: rgba(255,255,255,.035);
      --border: rgba(255,255,255,.08);
      --text: #f0eeea;
      --muted: rgba(240,238,234,.45);
      --dim: rgba(240,238,234,.22);
      --accent: #7c5cff;
      --display: 'Bricolage Grotesque', sans-serif;
      --body: 'Instrument Sans', sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: var(--body); line-height: 1.6; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 32px; }

    /* nav */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; gap: 20px;
      padding: 18px 32px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,.8);
      backdrop-filter: blur(20px);
    }
    .nav-back {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: .85rem; font-weight: 600; color: var(--muted);
      text-decoration: none; transition: color .2s;
    }
    .nav-back:hover { color: var(--text); }
    .nav-back svg { transition: transform .2s; }
    .nav-back:hover svg { transform: translateX(-3px); }
    .nav-sep { color: var(--dim); }
    .nav-title { font-size: .85rem; color: var(--text); font-weight: 600; }

    /* page hero */
    .blog-hero {
      padding: 140px 0 60px;
      border-bottom: 1px solid var(--border);
    }
    .blog-eyebrow {
      font-family: var(--mono); font-size: .72rem; letter-spacing: .18em;
      text-transform: uppercase; color: var(--dim); margin-bottom: 18px;
    }
    .blog-hero h1 {
      font-family: var(--display); font-size: clamp(2.2rem, 5vw, 3.8rem);
      font-weight: 800; letter-spacing: -.035em; line-height: 1.05; margin-bottom: 16px;
    }
    .blog-hero h1 em { font-style: normal; color: var(--accent); }
    .blog-hero p { font-size: 1.05rem; color: var(--muted); max-width: 55ch; }

    /* post grid */
    .blog-list { padding: 64px 0 120px; }
    .post-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }

    .post-card {
      display: block;
      padding: 32px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      transition: border-color .25s, transform .25s;
      position: relative; overflow: hidden;
    }
    .post-card::before {
      content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0;
      background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), rgba(124,92,255,.06), transparent 45%);
      transition: opacity .3s;
    }
    .post-card:hover { border-color: rgba(255,255,255,.18); transform: translateY(-3px); }
    .post-card:hover::before { opacity: 1; }

    .post-date {
      font-family: var(--mono); font-size: .7rem; letter-spacing: .1em;
      color: var(--dim); margin-bottom: 14px; text-transform: uppercase;
    }
    .post-title {
      font-family: var(--display); font-size: 1.45rem; font-weight: 800;
      letter-spacing: -.025em; margin-bottom: 12px; line-height: 1.2;
    }
    .post-summary { font-size: .9rem; color: var(--muted); line-height: 1.75; margin-bottom: 24px; }
    .post-cta {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: .82rem; font-weight: 600; color: var(--accent);
      transition: gap .2s;
    }
    .post-card:hover .post-cta { gap: 11px; }
    .post-cta svg { transition: transform .2s; }
    .post-card:hover .post-cta svg { transform: translate(3px,-3px); }

    /* footer */
    .blog-footer {
      padding: 40px 0;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 16px;
    }
    .blog-footer a {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: .85rem; font-weight: 600; color: var(--muted);
      transition: color .2s;
    }
    .blog-footer a:hover { color: var(--text); }

    /* empty state */
    .empty { padding: 80px 0; text-align: center; color: var(--dim); }

    /* responsive */
    @media (max-width: 900px) {
      .post-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      nav { padding: 14px 18px; gap: 12px; }
      .nav-title { display: none; }
      .wrap { padding: 0 18px; }
      .blog-hero { padding: 100px 0 40px; }
      .blog-hero h1 { font-size: 2.2rem; }
      .blog-list { padding: 40px 0 80px; }
      .post-card { padding: 24px 20px; }
      .blog-footer { flex-direction: column; gap: 12px; align-items: flex-start; }
    }
    @media (max-width: 400px) {
      .blog-hero h1 { font-size: 1.9rem; }
      .post-title { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="./index.html" class="nav-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Home
    </a>
    <span class="nav-sep">/</span>
    <span class="nav-title">Blog</span>
  </nav>

  <div class="wrap">

    <section class="blog-hero">
      <p class="blog-eyebrow">Writing</p>
      <h1>My <em>Journal</em></h1>
      <p>Thoughts on competitive programming, development, and everything in between.</p>
    </section>

    <section class="blog-list">
      <div class="post-grid" id="postGrid">
        <p class="empty" id="loadingMsg">Loading posts…</p>
      </div>
    </section>

    <footer class="blog-footer">
      <a href="./index.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to portfolio
      </a>
      <span style="font-family:var(--mono);font-size:.72rem;color:var(--dim)">swayam.dev / blog</span>
    </footer>

  </div>

  <script>
    // Card shimmer effect
    document.querySelectorAll('.post-card').forEach(card => {
      card.addEventListener('mousemove', e => {
        const r = card.getBoundingClientRect();
        card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        card.style.setProperty('--my', (e.clientY - r.top) + 'px');
      });
    });

    async function loadPosts() {
      const grid = document.getElementById('postGrid');
      try {
        const res = await fetch('http://localhost:3001/api/blogs');
        const json = await res.json();
        if (!json.ok || !json.data.length) {
          grid.innerHTML = '<p class="empty">No posts yet.</p>';
          return;
        }
        grid.innerHTML = json.data.map(post => `
          <a class="post-card" href="./blog-post.html?id=${post.id}">
            <div class="post-date">${post.date}</div>
            <div class="post-title">${post.title}</div>
            <p class="post-summary">${post.summary}</p>
            <span class="post-cta">
              Read article
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
            </span>
          </a>
        `).join('');

        // re-apply shimmer to dynamically created cards
        grid.querySelectorAll('.post-card').forEach(card => {
          card.addEventListener('mousemove', e => {
            const r = card.getBoundingClientRect();
            card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
            card.style.setProperty('--my', (e.clientY - r.top) + 'px');
          });
        });
      } catch (e) {
        grid.innerHTML = '<p class="empty">Could not load posts. Is the server running?</p>';
      }
    }

    loadPosts();
  </script>

</body>
</html>
